sonar.projectKey=tienda-medias-nextjs
sonar.projectName=tienda-medias
sonar.projectVersion=1.0.0

# Muy importante en Next.js para que no analice carpetas gigantescas de compilación
sonar.sources=.
sonar.exclusions=node_modules/**, .next/**, out/**, dist/**, public/**

# Configuración del servidor (si usas SonarCloud cambia la URL a https://sonarcloud.io)
sonar.host.url=https://sonarcloud.io
sonar.organization=emanuelnaon


# Indicar que use codificación UTF-8
sonar.sourceEncoding=UTF-8
